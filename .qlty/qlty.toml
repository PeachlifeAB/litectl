config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "bandit"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
]

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trufflehog"

# B101 flags `assert`, which Python strips under -O. That matters for a
# security check in production code, never for test files: they are made of
# assertions and pytest does not run optimized. Mirrors skips = ["B101"]
# in pyproject.toml, which qlty's bundled bandit does not read.
[[triage]]
match.rules = ["bandit:B101"]
match.file_patterns = ["**/test/**", "**/test_*.py"]
set.ignored = true

# B310 asks that urlopen callers restrict schemes. They do: every call site
# passes its URL through ensure_http_url first, which rejects anything but
# http(s). Bandit pattern-matches the call and cannot see the guard.
[[triage]]
match.rules = ["bandit:B310"]
match.file_patterns = [
  "src/modules/workspace/infrastructure/*.py",
  "template/tasks/infrastructure/*.py",
]
set.ignored = true

# B404/B603 flag importing and calling subprocess. Every invocation resolves
# its executable with shutil.which and passes an absolute path with literal
# arguments and no shell, which is what the Python docs prescribe.
[[triage]]
match.rules = ["bandit:B404", "bandit:B603"]
match.file_patterns = [
  "src/modules/workspace/infrastructure/*.py",
  "template/tasks/infrastructure/*.py",
]
set.ignored = true
